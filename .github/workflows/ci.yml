name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Monitor-macOS
          path: |
            dist/Codex-Usage-Monitor-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Codex-Usage-Monitor-Windows | Out-Null
          Copy-Item target\release\codex-usage-monitor.exe dist\Codex-Usage-Monitor-Windows\
          Copy-Item README.md,LICENSE dist\Codex-Usage-Monitor-Windows\
          Compress-Archive -Path dist\Codex-Usage-Monitor-Windows\* -DestinationPath dist\Codex-Usage-Monitor-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Monitor-Windows-x64
          path: dist/Codex-Usage-Monitor-Windows-x64.zip
          if-no-files-found: error
