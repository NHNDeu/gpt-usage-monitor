[package]
name = "codex-usage-monitor"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
description = "A lightweight multi-account Codex quota monitor for macOS and Windows"
license = "MIT"
repository = "https://github.com/NHNDeu/gpt-usage-monitor"
build = "build.rs"

[dependencies]
chrono = { version = "0.4.41", features = ["clock", "serde"] }
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
open = "5.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sys-locale = "0.3.2"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[build-dependencies]
ico = "0.4.0"
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.winresource]
ProductName = "Codex Usage Monitor"
FileDescription = "Multi-account Codex quota monitor"
OriginalFilename = "codex-usage-monitor.exe"
LegalCopyright = "Copyright (c) 2026 NHNDeu"
